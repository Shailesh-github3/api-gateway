spring.application.name=api-gateway

# Database (PostgreSQL) — match docker-compose host port 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/gateway
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME

# JPA / Hibernate — validate schema against Flyway-managed migrations
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Spring Security admin (Basic Auth over /admin/**)
spring.security.user.name=admin
spring.security.user.password=CHANGE_ME
spring.security.user.roles=ADMIN

# Redis (used by Bucket4j rate-limiting, metadata cache, and ShedLock)
spring.data.redis.client-type=jedis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Error details (useful for local development; disable in production)
server.error.include-message=always
server.error.include-binding-errors=always

# Logging — default INFO for app, adjust as needed
logging.level.root=INFO
logging.level.com.gateway=DEBUG
