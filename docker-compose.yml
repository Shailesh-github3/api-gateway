version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: api-gateway-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gateway
    ports:
      - "5433:5432" # Host 5433 maps to Container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: